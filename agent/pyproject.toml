[project]
name = "theliv-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-httpx",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
theliv-agent = "theliv_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["theliv_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
