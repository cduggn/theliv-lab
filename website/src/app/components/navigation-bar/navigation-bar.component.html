<header class="header">
  <a class="logo" routerLink="/kubernetes/overview" queryParamsHandling="preserve" aria-label="Theliv investigations">theliv<span aria-hidden="true"></span></a>
  <nav aria-label="Main navigation"><a routerLink="/kubernetes/overview" queryParamsHandling="preserve" class="nav-link">Investigations</a></nav>
  <div class="user-settings">
    <span class="product-label">Kubernetes diagnostics</span>
    <a class="video" target="_blank" rel="noopener noreferrer" *ngIf="configInfo?.videoLink" [href]="configInfo.videoLink" aria-label="Watch Theliv introduction"><fa-icon [icon]="faVideo"></fa-icon></a>
    <button class="theme-button" (click)="themeChanged()" [attr.aria-label]="isDarkModule ? 'Use light theme' : 'Use dark theme'" [attr.aria-pressed]="isDarkModule">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
    </button>
    <span class="user-profile" aria-label="User account"><fa-icon [icon]="faUser"></fa-icon></span>
    <span class="user-name" *ngIf="user">{{user.Displayname}}</span>
  </div>
</header>
